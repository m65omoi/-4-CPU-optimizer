[Hoi4Optimizer]
; 1 = 启用优化器, 0 = 禁用所有 Hook
Enabled = 1

; 1 = 绕过硬编码的 CPU 单核绑定 (拦截 SetThreadAffinityMask)
; 解决大小核 (Intel P-Core / E-Core) 掉队拖累问题，允许 Windows 调度器自由分配至大核
BypassAffinityPinning = 1

; 目标工作线程池总数 (1 主线程 + N-1 工作线程):
; 0  = 自动模式 (自适应物理大核数量，通常为 8 线程)
; 6  = 强制 6 线程 (1 主线程 + 5 工作线程)
; 8  = 强制 8 线程 (推荐，最适合多数 8 物理大核 CPU)
; 12 = 强制 12 线程
; -1 = 禁用线程池重塑 (使用游戏默认的全部逻辑核心)
WorkerThreadCount = 0

; 1 = 输出运行日志至 hoi4_optimizer.log, 0 = 关闭日志
EnableLog = 1
